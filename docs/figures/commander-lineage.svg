<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Horde commander versions</title>
<desc id="desc">Timeline of the five commanders: Baseline (control), V1 reinforcement learning (fails the route test), V2 predictive (passes, best overall), V2 + layer 1 and V2 + layer 2 adaptive options (no gain over V2).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="299" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" font-weight="600">Five horde commanders, one arena</text>
<text x="24.0" y="55.0" font-size="12.5" fill="#52514e">Each was scored against the same bot players with the same eval player. The two adaptive layers are options on top of V2.</text>
<line x1="100.0" y1="104.0" x2="780.0" y2="104.0" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="100.0" y="92.0" font-size="11.5" fill="#898781" text-anchor="middle">2026-09-24</text>
<circle cx="100.0" cy="104.0" r="6" fill="#898781" stroke="#fcfcfb" stroke-width="2"/>
<rect x="21" y="120" width="158" height="164" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<path d="M31,121.5 H169" stroke="#898781" stroke-width="3" stroke-linecap="round"/>
<text x="33.0" y="146.0" font-size="14" fill="#0b0b0b" font-weight="600">Baseline</text>
<text x="33.0" y="168.0" font-size="12" fill="#52514e">The game's own AI:</text>
<text x="33.0" y="185.0" font-size="12" fill="#52514e">chase the player within</text>
<text x="33.0" y="202.0" font-size="12" fill="#52514e">5 u, else walk straight</text>
<text x="33.0" y="219.0" font-size="12" fill="#52514e">to the base.</text>
<line x1="33.0" y1="242.0" x2="167.0" y2="242.0" stroke="#e1e0d9" stroke-width="1"/>
<g transform="translate(40.5,259.0)"><circle r="7.5" fill="#898781"/><path d="M-3.2,0 H3.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="53.0" y="263.5" font-size="12" fill="#0b0b0b" font-weight="600">the control group</text>
<text x="270.0" y="92.0" font-size="11.5" fill="#898781" text-anchor="middle">2026-09-25</text>
<circle cx="270.0" cy="104.0" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<rect x="191" y="120" width="158" height="164" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<path d="M201,121.5 H339" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/>
<text x="203.0" y="146.0" font-size="14" fill="#0b0b0b" font-weight="600">V1 · RL</text>
<text x="203.0" y="168.0" font-size="12" fill="#52514e">A PPO policy orders 3</text>
<text x="203.0" y="185.0" font-size="12" fill="#52514e">squads from 111</text>
<text x="203.0" y="202.0" font-size="12" fill="#52514e">observations; 2 M</text>
<text x="203.0" y="219.0" font-size="12" fill="#52514e">decisions of training.</text>
<line x1="203.0" y1="242.0" x2="337.0" y2="242.0" stroke="#e1e0d9" stroke-width="1"/>
<g transform="translate(210.5,259.0)"><circle r="7.5" fill="#d03b3b"/><path d="M-2.8,-2.8 L2.8,2.8 M2.8,-2.8 L-2.8,2.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="223.0" y="263.5" font-size="12" fill="#0b0b0b" font-weight="600">fails the route test</text>
<text x="223.0" y="278.0" font-size="11.5" fill="#898781">much more lethal</text>
<text x="440.0" y="92.0" font-size="11.5" fill="#898781" text-anchor="middle">2026-09-26</text>
<circle cx="440.0" cy="104.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<rect x="361" y="120" width="158" height="164" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<path d="M371,121.5 H509" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
<text x="373.0" y="146.0" font-size="14" fill="#0b0b0b" font-weight="600">V2 · Predictive</text>
<text x="373.0" y="168.0" font-size="12" fill="#52514e">Predicts where this</text>
<text x="373.0" y="185.0" font-size="12" fill="#52514e">player will flee, holds</text>
<text x="373.0" y="202.0" font-size="12" fill="#52514e">2 zombies at that</text>
<text x="373.0" y="219.0" font-size="12" fill="#52514e">refuge before it does.</text>
<line x1="373.0" y1="242.0" x2="507.0" y2="242.0" stroke="#e1e0d9" stroke-width="1"/>
<g transform="translate(380.5,259.0)"><circle r="7.5" fill="#0ca30c"/><path d="M-3.4,0.2 L-1,2.6 L3.4,-2.4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="393.0" y="263.5" font-size="12" fill="#0b0b0b" font-weight="600">passes the route test</text>
<text x="393.0" y="278.0" font-size="11.5" fill="#898781">best overall</text>
<text x="610.0" y="92.0" font-size="11.5" fill="#898781" text-anchor="middle">2026-10-06 → 07</text>
<circle cx="610.0" cy="104.0" r="6" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<rect x="531" y="120" width="158" height="164" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<path d="M541,121.5 H679" stroke="#1baf7a" stroke-width="3" stroke-linecap="round"/>
<text x="543.0" y="146.0" font-size="14" fill="#0b0b0b" font-weight="600">V2 + layer 1</text>
<text x="543.0" y="168.0" font-size="12" fill="#52514e">Thompson-samples the</text>
<text x="543.0" y="185.0" font-size="12" fill="#52514e">direction; a bandit</text>
<text x="543.0" y="202.0" font-size="12" fill="#52514e">learns how far out</text>
<text x="543.0" y="219.0" font-size="12" fill="#52514e">to wait. Runs 1–3.</text>
<line x1="543.0" y1="242.0" x2="677.0" y2="242.0" stroke="#e1e0d9" stroke-width="1"/>
<g transform="translate(550.5,259.0)"><circle r="7.5" fill="#898781"/><path d="M-3.2,-1.6 H3.2 M-3.2,1.6 H3.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="563.0" y="263.5" font-size="12" fill="#0b0b0b" font-weight="600">no gain over V2</text>
<text x="780.0" y="92.0" font-size="11.5" fill="#898781" text-anchor="middle">2026-10-08</text>
<circle cx="780.0" cy="104.0" r="6" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<rect x="701" y="120" width="158" height="164" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<path d="M711,121.5 H849" stroke="#1baf7a" stroke-width="3" stroke-linecap="round"/>
<text x="713.0" y="146.0" font-size="14" fill="#0b0b0b" font-weight="600">V2 + layer 2</text>
<text x="713.0" y="168.0" font-size="12" fill="#52514e">Learns whether the</text>
<text x="713.0" y="185.0" font-size="12" fill="#52514e">player avoids routes</text>
<text x="713.0" y="202.0" font-size="12" fill="#52514e">where it met zombies;</text>
<text x="713.0" y="219.0" font-size="12" fill="#52514e">predicts around it. Run 4.</text>
<line x1="713.0" y1="242.0" x2="847.0" y2="242.0" stroke="#e1e0d9" stroke-width="1"/>
<g transform="translate(720.5,259.0)"><circle r="7.5" fill="#898781"/><path d="M-3.2,-1.6 H3.2 M-3.2,1.6 H3.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="733.0" y="263.5" font-size="12" fill="#0b0b0b" font-weight="600">no gain over V2</text>
</svg>
