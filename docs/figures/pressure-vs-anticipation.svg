<svg xmlns="http://www.w3.org/2000/svg" width="880" height="418" viewBox="0 0 880 418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Pressure versus anticipation</title>
<desc id="desc">Two scatter plots (RunnerA, RunnerB80). x: share of flee decisions with a zombie already on the bot's chosen route; y: player damage per wave. V1 points sit high and left (lethal, no anticipation), V2 points sit low and right (on the route, near-baseline damage).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="417" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" font-weight="600">V1 learned pressure, V2 learned the route</text>
<text x="24.0" y="55.0" font-size="12.5" fill="#52514e">Phase 5 evaluation, one point per commander. x: flee decisions where a zombie was already on the route</text>
<text x="24.0" y="73.0" font-size="12.5" fill="#52514e">the bot then took (bot outside that sector). y: damage the player took per wave.</text>
<circle cx="29.0" cy="104.5" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"/>
<text x="40.0" y="108.0" font-size="12" fill="#52514e">Baseline</text>
