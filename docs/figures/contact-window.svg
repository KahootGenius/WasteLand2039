<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Contact rate by ambush distance and window</title>
<desc id="desc">Small multiples for routes A, B, C: contact rate of the bandit's ambush sites at 12, 18 and 25 units. Watching only during the escape favours the near site; watching 5 s past the escape end, all distances score about the same.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="403" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" font-weight="600">The bandit's 'best distance' came from the measurement window</text>
<text x="24.0" y="55.0" font-size="12.5" fill="#52514e">Run 3: how often an ambusher at 12, 18 or 25 u came within 6 u of a player who ran that route. Watched only until</text>
<text x="24.0" y="73.0" font-size="12.5" fill="#52514e">the escape tracker ended the escape, near sites win; watched 5 s longer, every distance works about equally.</text>
