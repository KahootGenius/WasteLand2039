# Variant of commander_ppo.yaml (v1_ppo_01) with the head-on interception bonus switched on.
# Why: in the v1_ppo_01 600k eval, interceptions came from chasing (zombies on the bot's heels),
# not from waiting on the route it was going to take (0 of 113 RunnerB80 flees via B had a zombie
# on B beforehand). The base interception reward pays the same for both, and chasing is easier to
# find. head_on_bonus (read by RLCommander each episode) adds this much when, at the interception,
# the nearest zombie is ahead of the player's movement (cos >= 0.5), i.e. it came from the front.
# Everything else is identical to commander_ppo.yaml; see there for the curriculum.
behaviors:
  HordeCommander:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    time_horizon: 128
    max_steps: 2000000
    summary_freq: 5000
    checkpoint_interval: 100000
    keep_checkpoints: 3
    threaded: false

environment_parameters:
  persona_level:
    curriculum:
      - name: Runners
        completion_criteria:
          measure: progress
          behavior: HordeCommander
          threshold: 0.2
        value: 0
      - name: Mixed
        completion_criteria:
          measure: progress
          behavior: HordeCommander
          threshold: 0.5
        value: 1
      - name: All
        value: 2
  head_on_bonus: 2.0
